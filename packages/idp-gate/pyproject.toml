[project]
name = "idp-gate"
version = "0.1.0"
description = "IDP platform CLI: service-contract validation, spec traceability, test-quality lint, spec approval (gates from v0.2)"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "jsonschema>=4.23"]

[project.scripts]
idp = "idp_gate.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idp_gate"]

[tool.hatch.build.targets.wheel.force-include]
"../../build-profiles" = "idp_gate/build_profiles"
